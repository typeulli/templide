# v로 시작하는 태그를 올리면 다섯 가지 설치 파일을 빌드하고, 그 태그의 GitHub 릴리스를 만들어 붙인다.
# 릴리스 노트는 GitHub가 이전 태그 이후의 커밋과 PR로 만든다. 태그에 '-'가 있으면(v1.2.0-beta.1) 시험판으로 올린다.
# Actions 탭에서 손으로 실행하면 빌드만 하고 설치 파일은 실행 결과(artifact)로 남긴다
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # build.py와 tools/gen_licenses.py가 한글을 출력한다. Windows 빌드 서버의 콘솔은 cp1252라 UTF-8로 바꾼다
  PYTHONUTF8: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows의 컴파일러(C++)는 MSYS2의 MinGW로 빌드한다. msystem과 C++ 컴파일러는 아키텍처마다 다르다
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            msystem: MINGW64
            toolchain: mingw-w64-x86_64-gcc
            cxx: g++
          - name: windows-x86
            os: windows-latest
            target: i686-pc-windows-msvc
            msystem: MINGW32
            toolchain: mingw-w64-i686-gcc
            cxx: g++
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-clang
            cxx: clang++
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macos
            os: macos-latest
            target: universal-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor/src-tauri -> target
          key: ${{ matrix.target }}

      # CMakeLists.txt가 최신 CMake를 요구한다. Ninja도 함께 설치된다
      - uses: lukka/get-cmake@latest

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.toolchain }}
          path-type: inherit

      # MSYS2의 MinGW는 정적 라이브러리와 CRT가 맞아 런타임을 모두 exe에 넣는다 (TEMPLIDE_STATIC)
      - name: Compiler (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B cmake-build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DTEMPLIDE_STATIC=ON -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build cmake-build-release

      - name: Build
        shell: bash
        run: python build.py --target ${{ matrix.target }} ${{ runner.os == 'Windows' && '--skip-compiler' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: installer/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
