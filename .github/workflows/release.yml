# Pushing a tag that starts with v builds the five installers and attaches them to a GitHub release for that tag.
# GitHub writes the release notes from the commits and PRs since the previous tag. A tag with '-' (v1.2.0-beta.1) is published as a prerelease.
# Running it by hand from the Actions tab only builds, and keeps the installers as run artifacts
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # build.py and tools/gen_licenses.py print Korean. The Windows runner console is cp1252, so switch Python to UTF-8
  PYTHONUTF8: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # On Windows the compiler (C++) is built with MinGW from MSYS2. The msystem and C++ compiler differ per architecture.
          # MSYS2 is phasing out 32-bit (MINGW32) with no replacement
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            msystem: UCRT64
            toolchain: mingw-w64-ucrt-x86_64-gcc
            cxx: g++
          - name: windows-x86
            os: windows-latest
            target: i686-pc-windows-msvc
            msystem: MINGW32
            toolchain: mingw-w64-i686-gcc
            cxx: g++
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-clang
            cxx: clang++
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macos
            os: macos-latest
            target: universal-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: editor/src-tauri -> target
          key: ${{ matrix.target }}

      # CMakeLists.txt requires a recent CMake. This also installs Ninja
      - uses: lukka/get-cmake@v4.4.2

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.toolchain }}
          path-type: inherit
          suppress-deprecation-warnings: msystem-mingw32

      # MSYS2's MinGW ships static libraries that match its CRT, so the whole runtime is linked into the exe (TEMPLIDE_STATIC)
      - name: Compiler (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B cmake-build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DTEMPLIDE_STATIC=ON -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build cmake-build-release

      # NSIS, which tauri downloads to make the installer. Cached so a GitHub server error during the download does not fail the build
      - uses: actions/cache@v6
        if: runner.os == 'Windows'
        with:
          path: ~/AppData/Local/tauri
          key: tauri-nsis-${{ runner.arch }}

      - name: Build
        shell: bash
        run: python build.py --target ${{ matrix.target }} ${{ runner.os == 'Windows' && '--skip-compiler' || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: installer/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
