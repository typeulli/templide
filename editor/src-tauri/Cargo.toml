[package]
name = "templide-editor"
version = "1.4.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde_json = "1"
base64 = "0.22"
portable-pty = "0.9.0"
tiny_http = "0.12.0"
notify = "8.2.0"
ttf-parser = "0.25"
encoding_rs = "0.8.42"
chardetng = "1.0.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# 개발용 빠른 빌드 (npm run build:fast). LTO를 끄고 여러 코어로 증분 컴파일한다
[profile.fast]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

# 설치 파일을 빨리 확인할 때 (python build.py --fast). release의 fat LTO는 마지막 단계를 코어 하나로 최적화해서 느리다.
# thin LTO는 여러 코어로 돌아 마지막 단계가 약 3배 빠르고(82초 -> 30초), 실행 파일은 약 8% 크다. 배포용은 release로 만든다
[profile.release-thin]
inherits = "release"
lto = "thin"
codegen-units = 16
